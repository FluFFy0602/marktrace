name: marktrace

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marktrace
      POSTGRES_PASSWORD: marktrace
      POSTGRES_DB: marktrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marktrace -d marktrace"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mock:
    build: ./mock
    environment:
      ADDR: ":8080"
      REGISTRY_FILE: /data/mock_registry.csv
      REGISTERED_FILE: /state/registered.csv
      MOCK_MODE: normal
      MOCK_SLOW_MS: "5000"
    volumes:
      - ./data/C16/mock_registry.csv:/data/mock_registry.csv:ro
      # Codes issued by MarkTrace (POST /cz/register); dropped together with the DB by `make reset`.
      - mockstate:/state
    ports:
      - "8082:8080"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://marktrace:marktrace@db:5432/marktrace?sslmode=disable
      MOCK_URL: http://mock:8080
      GOLDEN_DIR: /golden
      LISTEN_ADDR: ":8080"
    volumes:
      - ./golden:/golden:ro
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  mockstate:
