# MarkTrace CI. GitHub-Actions-compatible syntax (GitVerse CI/CD).
# Mirrors `make test` without Docker-in-Docker: PostgreSQL for backend
# integration tests comes from a service container.
# Not yet run on GitVerse runners: see docs/17-repo-regulation.md, section "CI".
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen:
    name: tools/gen — vet, tests, reproducible data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/gen/go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: Regenerate T1 and golden (seed 16) and require no diff
        run: |
          go run . -seed 16 -out ../../
          git -C ../.. diff --exit-code -- data golden

  mock:
    name: mock — vet, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mock/go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  backend:
    name: backend — vet, tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # internal/testdb creates and drops a database per test; without this
      # variable the integration tests are skipped, so it must be set here.
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: go build
        run: go build -o /dev/null ./cmd/server

  web:
    name: web — npm ci, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: build (tsc --noEmit && vite build)
        run: npm run build
